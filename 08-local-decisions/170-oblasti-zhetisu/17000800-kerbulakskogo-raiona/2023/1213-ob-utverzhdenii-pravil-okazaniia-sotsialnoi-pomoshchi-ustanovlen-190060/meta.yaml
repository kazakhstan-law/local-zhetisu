  title:
    rus: О внесении изменений и дополнений в решение Кербулакского районного маслихата от 13 декабря 2023 года № 09-80 «Об утверждении правил оказания социальной помощи, установления ее размеров и определения перечня отдельных категорий нуждающихся граждан Кербулакского района»
    kaz: Кербұлақ аудандық мәслихатының 2023 жылғы 13 желтоқсандағы «Кербұлақ ауданының әлеуметтік көмек көрсетудің, оның мөлшерлерін белгілеудің және мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындаудың қағидаларын бекіту туралы» № 09-80 шешіміне өзгерістер мен толықтырулар енгізу туралы
