act_code: '217375'
requisite: Решение Кербулакского районного маслихата области Жетісу от 24 ноября 2025 года № 30-229
title:
  rus: Об установлении повышенных на двадцать пять процентов окладов и тарифных ставок специалистам в области социального обеспечения, культуры, спорта являющимся гражданскими служащими и работающим в сельских населенных пунктах Кербулакского района, а также указанным специалистам, работающим в государственных организациях, финансируемых из местных бюджетов
  kaz: Кербұлақ ауданының азаматтық қызметші болып табылатын және ауылдық елді мекендерде жұмыс істейтін әлеуметтік қамсыздандыру, мәдениет, спорт саласындағы мамандарға, сондай-ақ жергілікті бюджеттерден қаржыландырылатын мемлекеттік ұйымдарда жұмыс істейтін аталған мамандарға жиырма бес пайызға жоғарылатылған айлықақылар мен тарифтік мөлшерлемелер белгілеу туралы
