  title:
    rus: О внесении изменений  в решение Кербулаского районного маслихата от 29 августа 2025 года № 27-213 «Об утверждении правил оказания социальной помощи, установления ее размеров и определения перечня отдельных категорий нуждающихся граждан Кербулаского района»
    kaz: Кербұлақ аудандық мәслихатының 2025 жылғы 29 тамыздағы «Кербұлақ ауданының әлеуметтік көмек көрсетудің, оның мөлшерлерін белгілеудің және мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындаудың қағидаларын бекіту туралы» № 27-213 шешіміне өзгерістер енгізу туралы»
