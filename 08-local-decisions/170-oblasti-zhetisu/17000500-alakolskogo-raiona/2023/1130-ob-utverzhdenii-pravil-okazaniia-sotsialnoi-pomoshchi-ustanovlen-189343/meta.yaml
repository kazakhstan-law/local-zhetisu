  title:
    rus: О внесении изменений в решение Алакольского районного маслихата от 30 ноября 2023 года № 16-1 «Об утверждении правил оказания социальной помощи, установления ее размеров и определения перечня отдельных категорий нуждающихся граждан Алакольского района»
    kaz: Алакөл аудандық мәслихатының 2023 жылғы 30 қарашадағы «Алакөл ауданының әлеуметтік көмек көрсетудің, оның мөлшерлерін белгілеудің және мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындаудың қағидаларын бекіту туралы» № 16-1 шешіміне өзгерістер енгізу туралы
