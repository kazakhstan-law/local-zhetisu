act_code: '181499'
requisite: Решение Сарканского районного маслихата области Жетісу от 10 мая 2023 года № 5-26. Утратило силу решением Сарканского районного маслихата области Жетісу от 22 октября 2025 года № 47-182 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении методики оценки деятельности административных государственных служащих корпуса «Б» государственного учреждения «Аппарат Сарканского районного маслихата»
