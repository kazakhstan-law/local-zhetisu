  title:
    rus: О внесении изменений и дополнений в решение маслихата от 10 мая 2023 года № 5-26 «Об утверждении Методики оценки деятельности административных государственных служащих корпуса «Б» государственного учреждения «Аппарат Сарканского районного маслихата»
    kaz: Мәслихаттың 2023 жылғы 20 мамырдағы № 5-26 «Сарқан аудандық мәслихатының аппараты» мемлекеттік мекемесінің «Б» корпусы мемлекеттік әкімшілік қызметшілерінің қызметін бағалау Әдістемесін бекіту туралы» шешіміне өзгерістер мен толықтырулар енгізу туралы
