act_code: '180590'
requisite: Решение Сарканского районного маслихата области Жетісу от 25 апреля 2023 года № 4-20. Зарегистрировано Департаментом юстиции области Жетісу 27 апреля 2023 года № 13-19
title:
  rus: «Об установлении повышенных на двадцать пять процентов окладов и тарифных ставок специалистам в области социального обеспечения, культуры, являющимся гражданскими служащими и работающим в сельских населенных пунктах Сарканского района, а также указанным специалистам, работающим в государственных организациях, финансируемых из местных бюджетов»
  kaz: «Сарқан ауданында азаматтық қызметші болып табылатын және ауылдық елдi мекендерде жұмыс iстейтiн әлеуметтiк қамсыздандыру, мәдениет саласындағы мамандарға жиырма бес пайызға жоғарылатылған айлықақылар мен тарифтік мөлшерлемелер белгілеу туралы»
