act_code: '180269'
requisite: Решение Сарканского районного маслихата области Жетісу от 25 апреля 2023 года № 4-21
title:
  rus: О предоставлении в 2023 году мер социальной поддержки специалистам в области здравоохранения,образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, государственным служащим аппаратов акимов сел, поселков, сельских округов, прибывшим для работы и проживания в сельские населенные пункты Сарканского района
  kaz: 2023 жылға Сарқан ауданының ауылдық елді мекендерге жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға, ауылдар, кенттер, ауылдық округтер әкімдері аппараттарының мемлекеттік қызметшілеріне көтерме жәрдемақы және тұрғын үй сатып алу немесе салу үшін бюджеттік кредит түрінде әлеуметтік қолдау шараларын ұсыну туралы
