  title:
    rus: О внесении изменений в решение Сарканского районного маслихата от 8 декабря 2023 года № 16-64 «Об утверждении правил оказания социальной помощи, установления ее размеров и определения перечня отдельных категорий нуждающихся граждан Сарканского района»
    kaz: Сарқан аудандық мәслихатының 2023 жылғы 8 желтоқсандағы «Сарқан ауданының әлеуметтік көмек көрсетудің, оның мөлшерлерін белгілеудің және мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындаудың қағидаларын бекіту туралы» № 16-64 шешіміне өзгерістер енгізу туралы
