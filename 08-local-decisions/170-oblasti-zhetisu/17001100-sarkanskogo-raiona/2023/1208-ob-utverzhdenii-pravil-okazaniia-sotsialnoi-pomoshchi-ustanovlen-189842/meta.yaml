    kaz: Сарқан аудандық мәслихатының 2023 жылғы 8 желтоқсандағы «Сарқан ауданының әлеуметтік көмек көрсетудің, оның мөлшерлерін белгілеудің және мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындаудың қағидаларын бекіту туралы» № 16-64 шешіміне өзгерістер мен толықтырулар енгізу туралы
