  title:
    rus: О внесении изменений и дополнений в решение Каратальского районного маслихата от 22 ноября 2023 года № 14-49 «Об утверждении правил оказания социальной помощи, установления ее размеров и определения перечня отдельных категорий нуждающихся граждан Каратальского района»
    kaz: Қаратал аудандық мәслихатының 2023 жылғы 22 қарашадағы «Қаратал ауданының әлеуметтік көмек көрсетудің, оның мөлшерлерін белгілеудің және мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындаудың қағидаларын бекіту туралы» № 14-49 шешіміне өзгерістер мен толықтырулар енгізу туралы
