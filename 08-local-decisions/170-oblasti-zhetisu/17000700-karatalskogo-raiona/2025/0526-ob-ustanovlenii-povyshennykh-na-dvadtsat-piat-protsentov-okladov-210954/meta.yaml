act_code: '210954'
requisite: Решение Каратальского районного маслихата области Жетісу от 26 мая 2025 года № 43-124. Зарегистрировано Департаментом юстиции области Жетісу 29 мая 2025 года № 315-19
title:
  rus: Об установлении повышенных на двадцать пять процентов окладов и тарифных ставок специалистам в области социального обеспечения, культуры, являющимся гражданскими служащими и работающим в сельских населенных пунктах Каратальского района, а также указанным специалистам, работающим в государственных организациях, финансируемых из местных бюджетов
  kaz: Қаратал ауданының азаматтық қызметші болып табылатын және ауылдық елді мекендерде жұмыс істейтін әлеуметтік қамсыздандыру, мәдениет саласындағы мамандарға, сондай-ақ жергілікті бюджеттерден қаржыландырылатын мемлекеттік ұйымдарда жұмыс істейтін аталған мамандарға жиырма бес пайызға жоғарылатылған айлықақылар мен тарифтік мөлшерлемелер белгілеу туралы
