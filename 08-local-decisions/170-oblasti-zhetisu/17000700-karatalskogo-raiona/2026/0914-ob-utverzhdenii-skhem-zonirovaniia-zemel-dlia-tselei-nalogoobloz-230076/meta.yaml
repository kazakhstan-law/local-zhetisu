title:
  rus: Об утверждении схем зонирования земель для целей налогообложения, границ оценочных зон и поправочных коэффициентов к базовым налоговым ставкам платы за земельные участки города Уштобе и сельских населенных пунктов Каратальского района
  kaz: Қаратал ауданы ауылдық елді мекендерінің және Үштөбе қаласының жерлерін салық салу мақсаты үшін аймақтарға бөлу схемасын, бағалау аймақтарының шекараларын және базалық салықтық ставкаларына түзету коэффициенттерін бекіту туралы
