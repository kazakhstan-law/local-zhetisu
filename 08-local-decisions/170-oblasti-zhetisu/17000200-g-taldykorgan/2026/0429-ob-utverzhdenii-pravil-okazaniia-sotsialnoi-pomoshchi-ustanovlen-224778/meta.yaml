  title:
    rus: О внесении изменений в решение Талдыкорганского городского маслихата от 29 апреля 2026 года № 53-292 «Об утверждении правил оказания социальной помощи, установления ее размеров и определения перечня отдельных категорий нуждающихся граждан города Талдыкорган»
    kaz: Талдықорған қалалық мәслихатының 2026 жылғы 29 сәуірдегі «Талдықорған қаласының әлеуметтік көмек көрсетудің, оның мөлшерлерін белгілеудің және мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындаудың қағидаларын бекіту туралы» № 53-292 шешіміне өзгерістер енгізу туралы
