  title:
    rus: О внесении изменений в решение Талдыкорганского городского маслихата от 29 апреля 2026 года № 53-290 «Об утверждении минимального размера расходов на управление объектом кондоминиума и содержание общего имущества объекта кондоминиума по городу Талдыкорган на 2026 год»
