  title:
    rus: О внесении изменений в решение Талдыкорганского городского маслихата от 15 ноября 2023 года № 11-68«Об утверждении правил оказания социальной помощи, установления ее размеров и определения перечня отдельных категорий нуждающихся граждан города Талдыкорган»
    kaz: Талдықорған қалалық мәслихатының 2023 жылғы 15 қарашадағы «Талдықорған қаласының әлеуметтік көмек көрсетудің, оның мөлшерлерін белгілеудің және мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындаудыңқағидаларын бекіту туралы» №11-68 шешіміне өзгерістер енгізу туралы
