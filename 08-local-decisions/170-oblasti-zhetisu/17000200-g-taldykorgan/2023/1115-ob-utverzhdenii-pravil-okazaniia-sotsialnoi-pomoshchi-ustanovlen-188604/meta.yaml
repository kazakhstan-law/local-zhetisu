requisite: Решение маслихата города Талдыкорган области Жетісу от 15 ноября 2023 года № 11-68. Зарегистрировано Департаментом юстиции области Жетісу 17 ноября 2023 года № 91-19. Утратило силу решением маслихата города Талдыкорган области Жетісу от 18 июня 2026 года № 54-296 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении правил оказания социальной помощи, установления ее размеров и определения перечня отдельных категорий нуждающихся граждан города Талдыкорган
  kaz: Талдықорған қаласының әлеуметтік көмек көрсетудің, оның мөлшерлерін белгілеудің және мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындаудың қағидаларын бекіту туралы
