act_code: '181919'
requisite: Решение маслихата города Талдыкорган области Жетісу от 22 мая 2023 года № 3-22. Зарегистрировано Департаментом юстиции области Жетісу 25 мая 2023 года № 33-19
title:
  rus: Об определении порядка и размера возмещения затрат на обучение на дому детей с ограниченными возможностями из числа детей с инвалидностью по индивидуальному учебному плану в городе Талдыкорган
  kaz: Талдықорған қаласында мүгедектігі бар балалар қатарындағы кемтар балаларды жеке оқыту жоспары бойынша үйде оқытуға жұмсаған шығындарын өндіріп алу тәртібі мен мөлшерін айқындау туралы
