    kaz: Ақсу аудандық мәслихатының 2023 жылғы 13 желтоқсандағы «Ақсу ауданының әлеуметтік көмек көрсетудің, оның мөлшерлерін белгілеудің және мұқтаж азаматтардың жекелеген санаттарының тізбесінайқындаудың қағидаларын бекіту туралы» № 19- 85 шешiмiне өзгерістер енгiзу туралы
