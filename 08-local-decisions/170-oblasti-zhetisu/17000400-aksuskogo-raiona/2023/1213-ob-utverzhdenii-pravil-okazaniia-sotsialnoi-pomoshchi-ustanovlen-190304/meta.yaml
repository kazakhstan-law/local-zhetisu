  title:
    rus: О внесении изменений в решение Аксуского районного маслихата от 13 декабря 2023 года № 19-85 «Об утверждении правил оказания социальной помощи, установления ее размеров и определения перечня отдельных категорий нуждающихся граждан Аксуского района»
    kaz: Ақсу аудандық мәслихатының 2023 жылғы 13 желтоқсандағы «Ақсу ауданының әлеуметтік көмек көрсетудің, оның мөлшерлерін белгілеудің және мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындаудың қағидаларын бекіту туралы» № 19-85 шешіміне өзгерістер енгізу туралы
