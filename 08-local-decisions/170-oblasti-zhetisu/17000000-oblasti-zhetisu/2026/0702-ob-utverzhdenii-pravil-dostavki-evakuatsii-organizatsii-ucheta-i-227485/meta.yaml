act_code: '227485'
requisite: Решение маслихата области Жетісу от 2 июля 2026 года № 38-239. Зарегистрировано в Министерстве юстиции Республики Казахстан 3 июля 2026 года № 39219
title:
  rus: Об утверждении Правил доставки (эвакуации), организации учета и временного хранения автомобильного транспортного средства, судна, в том числе маломерного судна, задержанного на основании, предусмотренном законодательством Республики Казахстан об административных правонарушениях, на специальных площадках или стоянках, создаваемых по решению местных исполнительных органов и находящихся в коммунальной собственности
  kaz: Қазақстан Республикасының әкімшілік құқық бұзушылық туралы заңнамасында көзделген негізде, жергілікті атқарушы органдардың шешімі бойынша құрылатын және коммуналдық меншіктегі арнаулы алаңдарда немесе тұрақтарда ұсталған автомобиль көлік құралын, кемені, оның ішінде шағын көлемді кемені жеткізу (эвакуациялау), есепке алуды және уақытша сақтауды ұйымдастыру қағидаларын бекіту туралы
