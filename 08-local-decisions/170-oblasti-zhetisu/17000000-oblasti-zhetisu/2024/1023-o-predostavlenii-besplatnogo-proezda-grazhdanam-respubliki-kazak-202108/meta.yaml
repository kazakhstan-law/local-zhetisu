act_code: '202108'
requisite: Решение маслихата области Жетісу от 23 октября 2024 года № 22-134. Зарегистрировано Департаментом юстиции области Жетісу 29 октября 2024 года № 247-19
title:
  rus: О предоставлении бесплатного проезда гражданам Республики Казахстан, проживающим в области Жетісу за пределы населенного пункта постоянного проживания для получения высокотехнологичных медицинских услуг в рамках гарантированного объема бесплатной медицинской помощи и (или) медицинской помощи в системе обязательного социального медицинского страхования
  kaz: Тегін медициналық көмектің кепілдік берілген көлемі шеңберінде жоғары технологиялық медициналық көрсетілетін қызметтерді және (немесе) міндетті әлеуметтік медициналық сақтандыру жүйесінде медициналық көмекті алуға Жетісу облысында тұратын Қазақстан Республикасының азаматтарына тұрақты тұратын елді мекеннен тысқары жерлерге тегін жол жүруді ұсыну туралы
