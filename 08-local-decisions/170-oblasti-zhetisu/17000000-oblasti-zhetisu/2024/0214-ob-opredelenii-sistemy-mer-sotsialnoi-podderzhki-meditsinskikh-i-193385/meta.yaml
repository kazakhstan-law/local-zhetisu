requisite: Решение маслихата области Жетісу от 14 февраля 2024 года № 14-84. Зарегистрировано Департаментом юстиции области Жетісу 15 февраля 2024 года № 138-19
title:
  rus: Об определении системы мер социальной поддержки медицинских и фармацевтических работников, направленных для работы в сельской местности, города районного и областного значения области Жетісу, а также порядка и размера оказания им социальной поддержки за счет бюджетных средств
  kaz: Жетісу облысының ауылдық жерге, аудандық және облыстық маңызы бар қалаларға жұмысқа жіберілген медицина және фармацевтика қызметкерлерін әлеуметтік қолдау шараларының жүйесін, сондай-ақ оларға бюджет қаражаты есебінен әлеуметтік қолдау көрсету тәртібі мен мөлшерін айқындау туралы
