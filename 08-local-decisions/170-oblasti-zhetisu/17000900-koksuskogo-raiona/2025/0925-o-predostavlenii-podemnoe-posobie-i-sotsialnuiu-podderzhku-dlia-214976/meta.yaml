act_code: '214976'
requisite: Решение Коксуского районного маслихата области Жетісу от 25 сентября 2025 года № 47-185. Отменено решением Коксуского районного маслихата области Жетісу от 20 апреля 2026 года № 54-218 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: О предоставлении подъемное пособие и социальную поддержку для приобретения или строительства жилья специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, государственным служащим аппаратов акимов сельских округов прибывшим для работы и проживания в сельские населенные пункты Коксуского района на 2025 год
  kaz: Көксу ауданының ауылдық елді мекендерге жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға, ауылдық округтер әкімдері аппараттарының мемлекеттік қызметшілеріне көтерме жәрдемақы және тұрғын үй алу немесе салу үшін әлеуметтік қолдауды 2025 жылға көрсету туралы
