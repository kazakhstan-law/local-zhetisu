act_code: '224488'
requisite: Решение Коксуского районного маслихата области Жетісу от 20 апреля 2026 года № 54-218
title:
  rus: О предоставлении подъемное пособие и социальную поддержку для приобретения или строительства жилья специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, государственным служащим аппаратов акимов сельских округов прибывшим для работы и проживания в сельские населенные пункты Коксуского района на 2026 год
  kaz: Көксу ауданының ауылдық елді мекендерге жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға, ауылдық округтер әкімдері аппараттарының мемлекеттік қызметшілеріне көтерме жәрдемақы және тұрғын үй алу немесе салу үшін әлеуметтік қолдауды 2026 жылға көрсету туралы
