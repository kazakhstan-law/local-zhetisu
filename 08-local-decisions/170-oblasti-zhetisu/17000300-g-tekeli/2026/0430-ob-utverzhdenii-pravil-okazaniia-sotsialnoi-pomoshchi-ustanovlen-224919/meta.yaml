  title:
    rus: О внесении изменений в решение Текелийского городского маслихата от 30 апреля 2026 года № 44-184 «Об утверждении правил оказания социальной помощи, установления ее размеров и определения перечня отдельных категорий нуждающихся граждан города Текели»
    kaz: Текелі қалалық мәслихатының 2026 жылғы 30 сәуіріндегі «Текелі қаласының әлеуметтік көмек көрсетудің, оның мөлшерлерін белгілеудің және мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындаудың қағидаларын бекіту туралы» № 44-184 шешіміне өзгерістер енгізу туралы
