  title:
    rus: О внесении изменений и дополнений в решение Текелийского городского маслихата от 26 декабря 2023 года № 11-65 «Об утверждении правил оказания социальной помощи, установления ее размеров и определения перечня отдельных категорий нуждающихся граждан города Текели»
    kaz: Текелі қалалық мәслихатының 2023 жылғы 26 желтоқсандағы «Текелі қаласының әлеуметтік көмек көрсетудің, оның мөлшерлерін белгілеудің және мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындаудың қағидаларын бекіту туралы» № 11-65 шешіміне өзгерістер мен толықтырулар енгізу туралы
