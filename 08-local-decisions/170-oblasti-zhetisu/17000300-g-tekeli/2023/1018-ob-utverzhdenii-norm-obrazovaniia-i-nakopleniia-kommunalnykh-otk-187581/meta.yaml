  title:
    rus: О внесении изменений в решение Текелийского городского маслихата от 18 октября 2023 года № 9-44 «Об утверждении норм образования и накопления коммунальных отходов, тарифов для населения на сбор, транспортировку твердых бытовых отходов по городу Текели»
    kaz: Текелі қалалық мәслихатының 2023 жылғы 18 қазандағы «Текелі қаласы бойынша коммуналдық қалдықтардың түзілу және жинақталу нормаларын, халық үшін қатты тұрмыстық қалдықтарды жинауға, тасымалдауға арналған тарифтерді бекіту туралы» № 9-44 шешіміне өзгерістер енгізу туралы
