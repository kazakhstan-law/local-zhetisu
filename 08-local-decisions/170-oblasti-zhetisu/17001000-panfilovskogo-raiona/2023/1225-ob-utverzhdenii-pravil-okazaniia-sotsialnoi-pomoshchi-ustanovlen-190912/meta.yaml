  title:
    rus: О внесении изменений и дополнений в решение Панфиловского районного маслихата от 25 декабря 2023 года № 8-14-68 «Об утверждении правил оказания социальной помощи, установления ее размеров и определения перечня отдельных категорий нуждающихся граждан Панфиловского района»
    kaz: Панфилов аудандық мәслихатының 2023 жылғы 25 желтоқсандағы «Панфилов ауданының әлеуметтік көмек көрсетудің, оның мөлшерлерін белгілеудің және мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындаудың қағидаларын бекіту туралы» № 8-14-68 шешіміне өзгерістер мен толықтырулар енгізу туралы
