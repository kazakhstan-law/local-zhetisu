    kaz: Панфилов аудандық мәслихатының 2023 жылғы 25 желтоқсандағы «Панфилов ауданының әлеуметтік көмек көрсетудің, оның мөлшерлерін белгілеудің және мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындаудың қағидаларын бекіту туралы» № 8-14-68 шешіміне өзгерістер енгізу туралы
