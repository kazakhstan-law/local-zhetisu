requisite: Решение Панфиловского районного маслихата области Жетісу от 3 ноября 2023 года № 8-11-56. Зарегистрировано Департаментом юстиции области Жетісу 6 ноября 2023 года № 80-19
title:
  rus: Об определении порядка и размера возмещения затрат на обучение на дому детей с ограниченными возможностями из числа детей с инвалидностью по индивидуальному учебному плану в Панфиловском районе
  kaz: Панфилов ауданында мүгедектігі бар балалар қатарындағы кемтар балаларды жеке оқыту жоспары бойынша үйде оқытуға жұмсаған шығындарын өндіріп алу тәртібі мен мөлшерін айқындау туралы
