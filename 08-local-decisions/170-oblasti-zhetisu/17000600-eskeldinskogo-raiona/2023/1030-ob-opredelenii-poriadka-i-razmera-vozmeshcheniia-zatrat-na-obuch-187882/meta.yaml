requisite: Решение Ескельдинского районного маслихата области Жетісу от 30 октября 2023 года № 13-44. Зарегистрировано Департаментом юстиции области Жетісу 2 ноября 2023 года № 79-19
title:
  rus: Об определении порядка и размера возмещения затрат на обучение на дому детей с ограниченными возможностями из числа детей с инвалидностью по индивидуальному учебному плану в Ескельдинском районе
  kaz: Ескелді ауданында мүгедектігі бар балалар қатарындағы кемтар балаларды жеке оқыту жоспары бойынша үйде оқытуға жұмсаған шығындарын өндіріп алу тәртібі мен мөлшерін айқындау туралы
