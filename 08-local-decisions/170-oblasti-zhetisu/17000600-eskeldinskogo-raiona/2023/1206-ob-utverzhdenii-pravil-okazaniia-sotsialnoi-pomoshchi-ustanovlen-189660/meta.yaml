  title:
    rus: О внесении изменений в решение Ескельдинского районного маслихата от 06 декабря 2023 года № 16-50 «Об утверждении правил оказания социальной помощи, установления ее размеров и определения перечня отдельных категорий нуждающихся граждан Ескельдинского района»
    kaz: Ескелді аудандық мәслихатының 2023 жылғы 06 желтоқсандағы «Ескелді ауданының әлеуметтік көмек көрсетудің, оның мөлшерлерін белгілеудің және мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындаудың қағидаларын бекіту туралы» №16-50 шешіміне өзгерістер енгізу туралы
