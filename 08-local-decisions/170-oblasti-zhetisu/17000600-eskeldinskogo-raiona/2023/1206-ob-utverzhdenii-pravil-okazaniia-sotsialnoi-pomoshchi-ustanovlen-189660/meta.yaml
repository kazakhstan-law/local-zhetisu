  title:
    rus: О внесении изменений и дополнений в решение Ескельдинского районного маслихата от 6 декабря 2023 года № 16-50 «Об утверждении правил оказания социальной помощи, установления ее размеров и определения перечня отдельных категорий нуждающихся граждан Ескельдинского района»
    kaz: Ескелді аудандық мәслихатының 2023 жылғы 6 желтоқсандағы «Ескелді аудандық әлеуметтік көмек көрсетудің, оның мөлшерлерін белгілеудің және мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындаудың қағидаларын бекіту туралы» № 16-50 шешіміне өзгерістер мен толықтырулар енгізу туралы
